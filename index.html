<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--head-->
    <!-- Page-specific tags (title, description, canonical URL, social card,
         structured data). scripts/prerender.mjs replaces this block for each
         page at build time, and src/lib/seo.ts keeps it current in the app. -->
    <title>ATOM - Toward an Agent Foundation Model</title>
    <meta
      data-head
      name="description"
      content="ATOM is an academic AI research group building general-purpose learning and reasoning agents that actively explore and discover world models."
    />
    <!--/head-->
    <meta name="author" content="ATOM Research Group" />
    <meta name="google-site-verification" content="VvAkbk73YADjlvPIdP-sm7e3mv6Tk1XJQd5B5uH6RbM" />
    <meta property="og:site_name" content="ATOM Research Group" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:site" content="@atomlab" />
    <meta name="twitter:creator" content="@atomlab" />

    <!-- The two fonts used above the fold, fetched alongside the script. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-normal.woff2"
    />

    <meta name="theme-color" content="#fbfaf8" />
    <link rel="icon" href="/favicon.ico?v=1" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ATOM Research Group",
        "url": "https://atomresearch.github.io/",
        "logo": "https://atomresearch.github.io/icon-512.png",
        "sameAs": ["https://github.com/atomresearch", "https://x.com/lancelotdacosta"],
        "description": "Toward an Agent Foundation Model - building agents that explore, model, and discover."
      }
    </script>
  </head>
  <body>
    <!-- Apply the saved or system theme before first paint, to avoid a flash. -->
    <script>
      (function () {
        var dark = false;
        try {
          var saved = localStorage.getItem("atom-theme");
          dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
